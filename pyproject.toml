[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntfs-mate"
version = "0.3.4"
description = "macOS NTFS 硬盘读写 TUI 工具（macFUSE + ntfs-3g）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ntfs", "macos", "tui", "disk", "ntfs-3g", "macfuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]
dependencies = ["textual>=0.86"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ntfs-mate = "ntfs_tui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ntfs_tui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
